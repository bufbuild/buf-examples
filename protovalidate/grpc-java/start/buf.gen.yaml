version: v2
inputs:
  - directory: src/main/proto
plugins:
  - remote: buf.build/protocolbuffers/java:v36.2
    out: build/generated/main/java
  - remote: buf.build/grpc/java:v1.85.1
    out: build/generated/main/java
managed:
  enabled: true
  override:
    - file_option: java_package_suffix
      value: gen
    - file_option: java_package_prefix
      value: ""
