version: v2
managed:
  enabled: true
  override:
    - file_option: go_package_prefix
      value: github.com/bufbuild/buf-examples/workspace/gen/proto/go
plugins:
  - remote: buf.build/protocolbuffers/go:v1.36.12
    out: gen/proto/go
    opt: paths=source_relative
  - remote: buf.build/connectrpc/go:v2.0.2
    out: gen/proto/go
    opt: paths=source_relative
